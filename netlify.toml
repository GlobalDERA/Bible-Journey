# Netlify deploys FULL Expo app (same as phone) - not just landing
# app/app.json already has web.output static -> `npx expo export` builds to app/dist
[build]
  base = "app"
  command = "npm install --legacy-peer-deps && npx expo export --platform web"
  publish = "dist"

# Fixes Expo Router deep links on Netlify (e.g. /study, /reader refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
